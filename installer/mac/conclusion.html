<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<style>
body { font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif; font-size: 13px; line-height: 1.6; color: #333; }
h1 { font-size: 16px; margin-bottom: 8px; color: #111; }
p { margin-bottom: 8px; }
.box { background: #f0f7ff; border: 1px solid #cce3ff; border-radius: 4px; padding: 12px; margin: 12px 0; }
ul { margin-left: 20px; margin-bottom: 8px; }
</style>
</head>
<body>
<h1>インストールが完了しました</h1>
<p>Praat 日本語音声ツールのプラグイン登録が正常に完了しました。</p>

<div class="box">
<strong>【ご利用方法】</strong>
<ul>
  <li>Praat を起動（既に起動中の場合は再起動）します。</li>
  <li>メニューバー: <strong>[Praat] &rarr; [日本語音声ツール (JA)]</strong></li>
  <li>アクションパネル: Sound や TextGrid 選択時に <strong>[日本語ツール (JA)]</strong></li>
</ul>
</div>

<p>プラグインを削除したい場合は、<code>~/Library/Preferences/Praat Prefs/plugin_JapaneseTools/</code> 内の <code>uninstall.command</code> を実行してください。</p>
</body>
</html>
