name: Build Windows Installer

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'installer/**'
      - 'scripts/**'
      - 'setup.praat'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Inno Setup Installer (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile Inno Setup Script
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: installer/installer.iss
          options: /O+

      - name: Verify Output Exists
        shell: powershell
        run: |
          $exePath = "dist\Praat-JapaneseTools-Setup.exe"
          if (-not (Test-Path $exePath)) {
            Write-Error "Installer executable was not found at $exePath!"
            Get-ChildItem -Recurse -Filter "*.exe" | Select-Object FullName
            exit 1
          }
          $item = Get-Item $exePath
          Write-Host "Success! Created installer: $($item.FullName) ($([math]::Round($item.Length / 1KB, 2)) KB)"

      - name: Upload Installer as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Praat-JapaneseTools-Setup
          path: dist/Praat-JapaneseTools-Setup.exe
          if-no-files-found: error

      - name: Create Release and Upload Asset (Tag Push only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Praat-JapaneseTools-Setup.exe
          generate_release_notes: true
