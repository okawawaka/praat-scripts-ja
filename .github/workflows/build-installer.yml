name: Build Windows Installer

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'installer/**'
      - 'scripts/**'
      - 'setup.praat'
      - '.github/workflows/build-installer.yml'
  pull_request:
    paths:
      - 'installer/**'
      - 'scripts/**'
      - 'setup.praat'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Inno Setup Installer (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Inno Setup
        shell: powershell
        run: |
          choco install innosetup -y --no-progress
          $innoDir = "C:\Program Files (x86)\Inno Setup 6"
          if (Test-Path $innoDir) {
            $innoDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            Write-Host "Added $innoDir to GITHUB_PATH"
          }

      - name: Compile Installer with ISCC
        shell: powershell
        run: |
          # ISCC の実行可能ファイルを探す
          $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue)?.Source
          if (-not $iscc) {
            $candidates = @(
              "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
              "C:\Program Files\Inno Setup 6\ISCC.exe",
              "C:\ProgramData\chocolatey\bin\iscc.exe"
            )
            foreach ($c in $candidates) {
              if (Test-Path $c) {
                $iscc = $c
                break
              }
            }
          }
          if (-not $iscc) {
            $found = Get-ChildItem -Path "C:\Program Files*" -Filter "ISCC.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) { $iscc = $found.FullName }
          }
          if (-not $iscc) {
            Write-Error "ISCC.exe not found on runner!"
            exit 1
          }

          Write-Host "Found ISCC compiler: $iscc"
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          
          # コンパイル実行
          & $iscc installer\installer.iss
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Inno Setup compilation failed with exit code $LASTEXITCODE"
            exit $LASTEXITCODE
          }

      - name: Verify Output Exists
        shell: powershell
        run: |
          $exePath = "dist\Praat-JapaneseTools-Setup.exe"
          if (-not (Test-Path $exePath)) {
            Write-Error "Installer executable was not generated at $exePath!"
            exit 1
          }
          $item = Get-Item $exePath
          Write-Host "Success! Created installer: $($item.FullName) ($([math]::Round($item.Length / 1KB, 2)) KB)"

      - name: Upload Installer as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Praat-JapaneseTools-Setup
          path: dist/Praat-JapaneseTools-Setup.exe
          if-no-files-found: error

      - name: Create Release and Upload Asset (Tag Push only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Praat-JapaneseTools-Setup.exe
          generate_release_notes: true
